name: CI

on:
    push:
        branches: [main, master, '*.x', WIP]
    pull_request:

permissions:
    contents: read

jobs:
    build:
        # Pinned explicitly so the required-status-check contexts stay `build (8.3)`
        # etc. even though the matrix carries an extra `mutation` dimension below.
        # Without this pin the include would rename the contexts to `build (8.4, true)`
        # and desync branch protection.
        name: build (${{ matrix.php }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                include:
                    # Mutation testing runs on exactly one leg — the score is a
                    # property of the tests, not of the PHP version. Selecting that
                    # leg through a matrix include rather than a bare
                    # `matrix.php == '8.4'` in the step makes a matrix edit LOUD:
                    # if this version ever leaves the list above, the include no
                    # longer merges into any combination and GitHub adds a visibly
                    # extra job, instead of silently skipping the step on every leg
                    # and leaving the mutation gate running nowhere.
                    - php: '8.4'
                      mutation: true

        steps:
            - id: checkout
              name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - id: setup_php
              name: Set up PHP version ${{ matrix.php }}
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2
                  # pcov drives the mutation run below. It is line-coverage only,
                  # so it costs far less than Xdebug on the steps that ignore it.
                  coverage: pcov

            - name: Validate composer.json and composer.lock
              run: composer validate

            - id: composer-cache-vars
              name: Composer Cache Vars
              run: |
                  echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
                  echo "timestamp=$(date +"%s")" >> $GITHUB_OUTPUT

            - id: composer-cache-dependencies
              name: Cache Composer dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.composer-cache-vars.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ steps.composer-cache-vars.outputs.timestamp }}
                  restore-keys: |
                      ${{ runner.os }}-composer-${{ matrix.php }}-
                      ${{ runner.os }}-composer-

            - id: install
              name: Install dependencies
              run: |
                  composer install --no-progress --no-interaction

            - id: php-lint
              name: PHP Lint
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:lint

            - id: psr4
              name: PSR-4 compliance
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:psr4

            - id: phpstan
              name: PHPStan
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:phpstan -- --error-format=github

            - id: rector
              name: Rector
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:rector

            - id: php-unit
              name: PHP Unit Tests
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:unit

            - id: cpd
              name: Copy-Paste Detection
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:cpd

            # Mutation testing. Deliberately NOT part of the `ci:test` aggregate —
            # that aggregate is what the pre-commit hook runs over the whole
            # worktree, and a full mutation run is too slow to pay on every commit —
            # so this step is the only place it runs. Which leg it runs on is
            # decided by the `mutation` matrix dimension, not by a literal here.
            #
            # `!cancelled()` rather than `always()`: the other steps use `always()`
            # so one red check still reports the rest, but this step re-runs the
            # suite once per mutant, and `always()` would keep that going even after
            # the run is cancelled. It additionally requires the unit tests to have
            # passed — infection needs a green suite as its baseline, so running it
            # against failing tests only burns minutes to reach the same red.
            - id: infection
              name: Mutation Testing
              if: ${{ !cancelled() && steps.install.conclusion == 'success' && steps['php-unit'].conclusion == 'success' && matrix.mutation }}
              run: |
                  composer ci:test:php:infection

            - id: cgl
              name: CGL
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:cgl -- --dry-run
