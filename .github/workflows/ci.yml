name: CI

on:
    push:
        branches: [main, master, '*.x', WIP]
    pull_request:

permissions:
    contents: read

jobs:
    # Copy-paste detection runs in the shared Node-only lane, since jscpd is a
    # Node tool.
    cpd:
        uses: magicsunday/.github/.github/workflows/cpd.yml@main
        permissions:
            contents: read

    build:
        # Pinned explicitly so the required-status-check contexts stay `build (8.3)`
        # etc. even though the matrix carries an extra `mutation` dimension below.
        # Without this pin the include would rename the contexts to `build (8.4, true)`
        # and desync branch protection.
        name: build (${{ matrix.php }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                include:
                    # Mutation testing runs on exactly one leg — the score is a
                    # property of the tests, not of the PHP version. Selecting that
                    # leg through a matrix include rather than a bare
                    # `matrix.php == '8.4'` in the step makes a matrix edit LOUD:
                    # if this version ever leaves the list above, the include no
                    # longer merges into any combination and GitHub adds a visibly
                    # extra job, instead of silently skipping the step on every leg
                    # and leaving the mutation gate running nowhere.
                    - php: '8.4'
                      mutation: true

        steps:
            - id: checkout
              name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # The changed-lines mutation step needs the history of the base branch.
                  fetch-depth: 0

            - id: setup_php
              name: Set up PHP version ${{ matrix.php }}
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2
                  # pcov drives the mutation run below. It is line-coverage only,
                  # so it costs far less than Xdebug on the steps that ignore it.
                  coverage: pcov

            - name: Validate composer.json and composer.lock
              run: composer validate

            - id: composer-cache-vars
              name: Composer Cache Vars
              run: |
                  echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
                  echo "timestamp=$(date +"%s")" >> $GITHUB_OUTPUT

            - id: composer-cache-dependencies
              name: Cache Composer dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.composer-cache-vars.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ steps.composer-cache-vars.outputs.timestamp }}
                  restore-keys: |
                      ${{ runner.os }}-composer-${{ matrix.php }}-
                      ${{ runner.os }}-composer-

            - id: install
              name: Install dependencies
              run: |
                  composer install --no-progress --no-interaction

            - id: php-lint
              name: PHP Lint
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:lint

            - id: psr4
              name: PSR-4 compliance
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:psr4

            - id: phpstan
              name: PHPStan
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:phpstan -- --error-format=github

            - id: phpat-subjects
              name: phpat subjects
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:phpat-subjects

            - id: templates
              name: Templates
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:templates

            - id: deptrac
              name: Deptrac
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:deptrac

            - id: rector
              name: Rector
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:rector

            # The tests of the catalogue resolver run the gettext tools. Without them
            # those tests skip themselves, so the step is what makes them run here and
            # fails when a tool is missing, instead of letting them skip unnoticed.
            - id: gettext
              name: Install the gettext tools
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends gettext

                  for tool in msgcat msgattrib msgmerge msgfmt; do
                      command -v "$tool" > /dev/null || { echo "::error::$tool is not installed"; exit 1; }
                  done

            - id: php-unit
              name: PHP Unit Tests
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:test:php:unit

            # The ownership test hands the catalogue to a foreign owner and group and checks
            # that a rewrite keeps both, which only root may do. On the runner user it skips
            # itself in the step above, so this step runs that one test through sudo. The
            # result does not depend on the PHP version, so it runs on the leg of the mutation
            # run. A skip fails the step, and the cache stays outside the workspace so that
            # root leaves no file there.
            - id: ownership
              name: PHP Unit ownership test as root
              if: ${{ always() && steps.install.conclusion == 'success' && steps.gettext.conclusion == 'success' && matrix.mutation }}
              run: |
                  sudo -E env "PATH=$PATH" php .build/vendor/phpunit/phpunit/phpunit \
                      --configuration phpunit.xml \
                      --filter keepsTheOwnerAndTheGroupOfTheCatalogue \
                      --cache-directory "$RUNNER_TEMP/phpunit-root" \
                      --fail-on-skipped \
                      --fail-on-empty-test-suite

            # Mutation testing. Deliberately NOT part of the `ci:test` aggregate,
            # which is what the pre-commit hook runs over the whole worktree, and a
            # full mutation run is too slow to pay on every commit, so these steps
            # are the only place it runs. Which leg they run on is decided by the
            # `mutation` matrix dimension, not by a literal here.
            #
            # `!cancelled()` rather than `always()`: the other steps use `always()`
            # so one red check still reports the rest, but these steps re-run the
            # suite once per mutant, and `always()` would keep that going even after
            # the run is cancelled. They additionally require the unit tests to have
            # passed, because infection needs a green suite as its baseline, so running it
            # against failing tests only burns minutes to reach the same red.
            #
            # A pull request is gated on the covered code of the lines it changes, which
            # holds the tests of new code to its mutants without forcing tests for old
            # trivial code. A push to a branch runs the whole tree and only reports,
            # because the score is a diagnostic and no gate.
            - id: infection_changed
              name: Mutation Testing (changed lines)
              if: ${{ !cancelled() && steps.install.conclusion == 'success' && steps['php-unit'].conclusion == 'success' && matrix.mutation && github.event_name == 'pull_request' }}
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  composer ci:test:php:infection:changed -- --git-diff-base="origin/${BASE_REF}"

            - id: infection
              name: Mutation Testing (full run, report only)
              if: ${{ !cancelled() && steps.install.conclusion == 'success' && steps['php-unit'].conclusion == 'success' && matrix.mutation && github.event_name != 'pull_request' }}
              run: |
                  composer ci:test:php:infection

            - id: cgl
              name: CGL
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: |
                  composer ci:cgl -- --dry-run
